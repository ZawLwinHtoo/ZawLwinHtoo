<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title">
<title id="title">Zaw Lwin Htoo / apple</title>
<defs>
<pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8a9885" opacity=".18" /></pattern>
</defs>
<style>
.traffic{animation:travel 9s linear infinite}
.ring{animation:breathe 5s ease-in-out infinite}
.eye{animation:blink 8s step-end infinite}
@keyframes travel{to{stroke-dashoffset:-100}}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:.7}}
@keyframes blink{0%,46%,49%,100%{opacity:1}47%,48%{opacity:.1}}
@media(prefers-reduced-motion:reduce){.traffic,.ring,.eye{animation:none}}

.bio-wave{animation:hello-wave 2.4s ease-in-out infinite;transform-origin:0px 55px}
@keyframes hello-wave{0%,60%,100%{transform:rotate(0deg)}15%,35%{transform:rotate(13deg)}25%,45%{transform:rotate(-10deg)}}
.bio-cursor{animation:cursor-blink 1s step-end infinite}
@keyframes cursor-blink{50%{opacity:0}}
.bio-pulse{animation:bio-pulse 3s ease-in-out infinite;transform-origin:0 0}
@keyframes bio-pulse{0%,100%{opacity:.65}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.bio-wave,.bio-cursor,.bio-pulse{animation:none}}
</style>
<rect width="1200" height="460" rx="20" fill="#131613" />
<rect width="1200" height="460" rx="20" fill="url(#dot-grid)" />
