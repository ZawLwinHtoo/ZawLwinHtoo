<circle cx="884" cy="233" r="158" fill="#1b2119" stroke="#374132" />
<circle class="ring" cx="884" cy="233" r="139" fill="none" stroke="#c9ff59" stroke-dasharray="3 14" />
<path d="M700 233h368M884 61v344" stroke="#374132" stroke-dasharray="4 8" />
<path d="M600 315h78v-82h48M1041 233h84v-83h45" fill="none" stroke="#46513e" stroke-width="2" />
<path class="traffic" d="M600 315h78v-82h48" fill="none" stroke="#c9ff59" stroke-width="3" pathLength="100" stroke-dasharray="8 92" />
<text x="1020" y="352" fill="#a5afa0" font-family="Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400">FRUIT</text></g>
