name: Verify free bio artwork

on:
  push:
    branches: [feat/free-bio-artwork]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.repository == 'ZawLwinHtoo/ZawLwinHtoo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download public metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/prepare_profile.py
      - name: Install CPU inference engine
        run: >-
          python -m pip install --only-binary=:all: llama-cpp-python==0.3.36
          --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Generate real bio and example illustrations without an API
        run: python tools/generate_free_art.py --examples
      - name: Save reviewable artwork on the test branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/bio-art.json assets/bio-proof-*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Verify free open-model artwork with real generated examples'
            git push
          fi
