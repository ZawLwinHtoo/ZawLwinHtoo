name: Refresh profile

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'assets/bio-art.json'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'ZawLwinHtoo/ZawLwinHtoo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify generator
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Fetch current public metadata
        id: profile
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/prepare_profile.py
      - name: Install free CPU inference engine only for a changed bio
        if: steps.profile.outputs.needs_art == 'true'
        run: >-
          python -m pip install --only-binary=:all: llama-cpp-python==0.3.36
          --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Generate original artwork locally without an API
        id: artwork
        if: steps.profile.outputs.needs_art == 'true'
        continue-on-error: true
        run: python tools/generate_free_art.py
      - name: Update current bio text and project showcase
        run: python tools/update_profile.py --snapshot .profile-snapshot.json
      - name: Save changed profile assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh bio and free generated artwork'
            git push
          fi
      - name: Report an artwork failure after publishing current bio text
        if: steps.artwork.outcome == 'failure'
        run: |
          echo '::error::Bio text was refreshed, but local illustration generation failed. Rerun this workflow to retry.'
          exit 1
