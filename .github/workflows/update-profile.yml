name: Refresh profile

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify generator
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Fetch public profile and generate moving showcase
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/update_profile.py
      - name: Save changed profile assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/
          if ! git diff --cached --quiet; then
            git commit -m 'Sync bio artwork and animated project showcase'
            git push
          fi
